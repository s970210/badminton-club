<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>羽球排點</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0F2E27; }
  body { color: #F4F1E6; font-family: 'Inter', sans-serif; padding-bottom: 40px; min-height: 100vh; }
  ::selection { background: #F2B705; color: #0F2E27; }
  input:focus, button:focus { outline: 2px solid #F2B705; outline-offset: 2px; }
  .spin { display:inline-block; animation: spin 3s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }

  .header { display:flex; align-items:center; justify-content:space-between; padding:18px 16px 10px; }
  .brand { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:1px; line-height:1; }
  .brandSub { font-size:10px; color:#8FB0A4; letter-spacing:2px; margin-top:2px; }
  .roundBadge { background:#164035; border:1px solid #234E42; border-radius:10px; padding:4px 12px; text-align:center; }
  .roleBar { display:flex; align-items:center; justify-content:space-between; padding:0 16px 10px; }
  .roleTagAdmin { font-size:12px; font-weight:700; color:#F2B705; }
  .roleTagPlayer { font-size:12px; font-weight:700; color:#8FB0A4; }
  .switchBtn { background:transparent; border:1px solid #234E42; color:#8FB0A4; border-radius:999px; padding:4px 10px; font-size:11px; cursor:pointer; }
  .tabBar { display:flex; gap:6px; padding:0 16px 12px; flex-wrap:wrap; }
  .tabBtn { flex:1; min-width:56px; padding:9px 0; background:transparent; border:1px solid #234E42; border-radius:999px; color:#8FB0A4; font-size:13px; font-weight:600; cursor:pointer; }
  .tabBtnActive { background:#F2B705; border-color:#F2B705; color:#0F2E27; }
  .content { padding:0 16px; }
  .sectionTitle { font-size:11px; letter-spacing:2px; color:#8FB0A4; text-transform:uppercase; margin:18px 0 8px; }
  .card { background:#164035; border:1px solid #234E42; border-radius:16px; padding:14px; }
  .row { display:flex; gap:8px; }
  input.text { flex:1; background:#0F2E27; border:1px solid #234E42; border-radius:10px; padding:10px 12px; color:#F4F1E6; font-size:14px; width:100%; }
  .goldBtn { background:#F2B705; color:#0F2E27; border:none; border-radius:10px; padding:0 16px; height:40px; font-weight:700; font-size:14px; cursor:pointer; }
  .emptyHint { color:#8FB0A4; font-size:13px; margin-top:12px; }
  .chipWrap { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .chip { display:flex; align-items:center; gap:6px; background:#0F2E27; border:1px solid #234E42; border-radius:999px; padding:6px 6px 6px 12px; font-size:13px; cursor:pointer; }
  .chipX { background:#234E42; border:none; color:#F4F1E6; border-radius:50%; width:18px; height:18px; font-size:10px; cursor:pointer; line-height:18px; }
  .toggleBtn { flex:1; padding:10px 0; background:#0F2E27; border:1px solid #234E42; border-radius:10px; color:#8FB0A4; font-size:13px; font-weight:600; cursor:pointer; }
  .toggleBtnActive { background:#234E42; color:#F4F1E6; border-color:#F2B705; }
  .label { font-size:14px; color:#F4F1E6; }
  .stepBtn { width:30px; height:30px; border-radius:50%; border:1px solid #234E42; background:#0F2E27; color:#F4F1E6; font-size:16px; cursor:pointer; }
  .hint { font-size:12px; color:#8FB0A4; margin-top:8px; }
  .primaryBtn { width:100%; margin-top:18px; padding:15px 0; background:#F2B705; color:#0F2E27; border:none; border-radius:14px; font-size:15px; font-weight:700; cursor:pointer; }
  .primaryBtn:disabled { opacity:0.4; }
  .ghostBtn { width:100%; margin-top:6px; padding:11px 0; background:transparent; color:#8FB0A4; border:1px dashed #234E42; border-radius:12px; font-size:13px; cursor:pointer; }
  .dangerGhostBtn { width:100%; margin-top:10px; padding:11px 0; background:transparent; color:#E85C4A; border:1px solid #3a2620; border-radius:12px; font-size:13px; cursor:pointer; }
  .tipBox { background:#123A30; border:1px solid #234E42; border-radius:12px; padding:10px 12px; font-size:12px; color:#8FB0A4; margin-bottom:10px; }
  .squadGrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .squadCard { background:#164035; border:1px solid #234E42; border-radius:14px; padding:10px; }
  input.squadNameInput { width:100%; background:transparent; border:none; border-bottom:1px solid #234E42; color:#F2B705; font-weight:700; font-size:13px; padding:2px 0 6px; }
  .squadNameStatic { color:#F2B705; font-weight:700; font-size:13px; padding-bottom:6px; border-bottom:1px solid #234E42; }
  .squadMember { font-size:13px; padding:6px 6px; border-radius:8px; margin-top:4px; background:#0F2E27; }
  .squadMemberSelected { background:#F2B705; color:#0F2E27; font-weight:700; }
  .court { background:linear-gradient(180deg,#164035,#123A30); border:1px solid #234E42; border-radius:16px; padding:14px; margin-bottom:12px; }
  .courtEditable { border-color:#F2B705; }
  .courtLabel { display:flex; justify-content:space-between; font-size:11px; letter-spacing:1px; color:#8FB0A4; margin-bottom:10px; }
  .doneTag { color:#F2B705; font-weight:700; }
  .courtBody { display:flex; align-items:center; gap:8px; }
  .netLine { display:flex; flex-direction:column; align-items:center; width:44px; }
  .netDash { width:1px; height:14px; border-left:2px dashed #3a5c50; }
  .vs { font-size:10px; color:#8FB0A4; margin:2px 0; }
  .squadTitle { font-size:15px; font-weight:700; }
  .squadSub { font-size:12px; color:#8FB0A4; margin-top:1px; }
  .playerWon { color:#F2B705; }
  .scoreRow { display:flex; align-items:center; gap:8px; margin-top:12px; justify-content:center; }
  input.scoreInput { width:52px; text-align:center; background:#0F2E27; border:1px solid #234E42; border-radius:10px; padding:8px 0; color:#F4F1E6; font-family:'JetBrains Mono',monospace; font-size:16px; }
  .scoreDash { color:#8FB0A4; }
  .confirmBtn { margin-left:6px; background:#234E42; color:#F4F1E6; border:1px solid #F2B705; border-radius:10px; padding:9px 14px; font-size:13px; font-weight:700; cursor:pointer; }
  .restBox { background:#1a2e28; border:1px solid #3a2620; border-radius:14px; padding:12px; margin-top:6px; margin-bottom:6px; }
  .restChip { background:#0F2E27; border:1px solid #3a2620; color:#E8A99E; border-radius:999px; padding:4px 10px; font-size:12px; display:inline-block; margin:2px; }
  .emptyState { text-align:center; padding:60px 20px; }
  .rankRow { display:flex; align-items:center; gap:12px; background:#164035; border:1px solid #234E42; border-radius:14px; padding:12px 14px; margin-bottom:8px; }
  .rankRowFirst { border-color:#F2B705; box-shadow:0 0 0 1px #F2B705 inset; }
  .rankNum { width:28px; text-align:center; font-size:18px; font-weight:700; }
  .rankName { font-size:15px; font-weight:700; }
  .rankMeta { font-size:11px; color:#8FB0A4; margin-top:2px; }
  .rankPts { text-align:center; }
  .rankPtsNum { font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; }
  .historyRow { display:flex; align-items:center; gap:10px; font-size:13px; padding:8px 0; border-bottom:1px solid #1c342d; }
  .historyCourt { color:#8FB0A4; font-size:11px; width:40px; }
  .historyWin { color:#F2B705; font-weight:700; }
  .footer { text-align:center; font-size:11px; color:#4d6a60; margin-top:24px; padding:0 20px; }
  .gateCard { background:#164035; border:1px solid #234E42; border-radius:16px; margin-bottom:12px; overflow:hidden; }
  .gateCardHead { width:100%; display:flex; justify-content:space-between; align-items:center; background:transparent; border:none; color:#F4F1E6; font-size:15px; font-weight:700; padding:16px; cursor:pointer; }
  .gateCardBody { padding:0 14px 14px; }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   羽球排點 · 獨立網頁版
   後端：Google Apps Script（免登入、免帳號，任何人打開都能用）
   ========================================================= */

// ⚠️ 換成你自己部署的 Apps Script 網址（結尾是 /exec）
const API_URL = "https://script.google.com/macros/s/AKfycbzjC3U2StZ_7HfWovDf-4f-0IlvRL0T0ZiLdPfgAJvvJgqcOs3_1Vz-5N2Fkrc9B3-2YQ/exec";

const FONT_OK = true;

// ---------- 工具函式 ----------
function uid() { return Math.random().toString(36).slice(2, 10); }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pairKey(x, y) { return [x, y].sort().join("~"); }
function makePlayer(name) { return { id: uid(), name }; }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function buildSquads(players, mode) {
  if (mode === "singles") {
    return {
      squads: players.map((p) => ({ id: p.id, name: p.name, memberIds: [p.id], wins: 0, losses: 0, gamesPlayed: 0, pointsFor: 0, pointsAgainst: 0, sessionPoints: 0, restStreak: 0 })),
      bench: null,
    };
  }
  const shuffled = shuffle(players);
  const squads = [];
  let count = 1, i = 0;
  for (; i + 1 < shuffled.length; i += 2) {
    squads.push({ id: uid(), name: `隊伍${count}`, memberIds: [shuffled[i].id, shuffled[i + 1].id], wins: 0, losses: 0, gamesPlayed: 0, pointsFor: 0, pointsAgainst: 0, sessionPoints: 0, restStreak: 0 });
    count++;
  }
  const bench = shuffled.length % 2 === 1 ? shuffled[shuffled.length - 1] : null;
  return { squads, bench };
}

function generateRound(squads, courts, history) {
  const n = squads.length;
  const courtsUsed = Math.min(courts, Math.floor(n / 2));
  if (courtsUsed < 1) return null;
  const slots = courtsUsed * 2;
  const sorted = [...squads].sort((a, b) => {
    if (b.restStreak !== a.restStreak) return b.restStreak - a.restStreak;
    if (a.gamesPlayed !== b.gamesPlayed) return a.gamesPlayed - b.gamesPlayed;
    return Math.random() - 0.5;
  });
  const active = sorted.slice(0, slots);
  const resting = sorted.slice(slots);
  let best = null, bestScore = Infinity;
  for (let attempt = 0; attempt < 60; attempt++) {
    const s = shuffle(active);
    const matches = [];
    for (let c = 0; c < courtsUsed; c++) {
      const a = s[c * 2], b = s[c * 2 + 1];
      matches.push({ id: uid(), court: c + 1, squadAId: a.id, squadBId: b.id, scoreA: "", scoreB: "", completed: false });
    }
    let score = 0;
    matches.forEach((m) => { score += history[pairKey(m.squadAId, m.squadBId)] || 0; });
    if (score < bestScore) { bestScore = score; best = matches; }
    if (bestScore === 0) break;
  }
  return { matches: best, restingIds: resting.map((r) => r.id) };
}

function defaultSession() {
  return { players: [], mode: "doubles", courts: 2, squads: [], bench: null, locked: false, rounds: [], history: {} };
}

// ---------- 狀態 ----------
let session = defaultSession();
let sessionLoaded = false;
let identity = loadIdentity();
let ui = { tab: "setup", entered: !!identity.entered, gateStep: "role", gateRole: null, gateErr: "", selectedMember: null };
let saveOk = true;
let saveTimer = null;
let anyInputFocused = false;
let pendingRemote = null;

function loadIdentity() {
  try {
    const raw = localStorage.getItem("badminton-identity");
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { isAdmin: false, playerId: null, room: null, entered: false };
}
function saveIdentity() {
  try { localStorage.setItem("badminton-identity", JSON.stringify(identity)); } catch (e) {}
}

// ---------- API（依房間代碼分開儲存）----------
async function apiLoad(room) {
  const res = await fetch(API_URL + "?room=" + encodeURIComponent(room));
  const data = await res.json();
  if (data && data.value) {
    try { return JSON.parse(data.value); } catch (e) { return null; }
  }
  return null;
}
async function apiSave(room, obj) {
  try {
    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "set", room: room, value: JSON.stringify(obj) }),
    });
    saveOk = true;
  } catch (e) {
    saveOk = false;
  }
  renderSaveStatus();
}
function queueSave() {
  if (!identity.room) return;
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => apiSave(identity.room, session), 350);
}

function applyRemote(remote) {
  if (!remote) return;
  session = Object.assign(defaultSession(), remote);
}

async function pollLoop() {
  if (!identity.room || !ui.entered) { setTimeout(pollLoop, 3000); return; }
  try {
    const remote = await apiLoad(identity.room);
    if (remote) {
      const remoteStr = JSON.stringify(remote);
      const localStr = JSON.stringify(session);
      if (remoteStr !== localStr) {
        if (anyInputFocused) {
          pendingRemote = remote;
        } else {
          applyRemote(remote);
          render();
        }
      }
    }
  } catch (e) {}
  setTimeout(pollLoop, 3000);
}

document.addEventListener("focusin", (e) => {
  if (e.target && (e.target.tagName === "INPUT")) anyInputFocused = true;
});
document.addEventListener("focusout", (e) => {
  if (e.target && (e.target.tagName === "INPUT")) {
    anyInputFocused = false;
    if (pendingRemote) { applyRemote(pendingRemote); pendingRemote = null; render(); }
  }
});

// ---------- 身份（密碼 = 房間代碼，同密碼 = 同一個房間）----------
async function submitGateForm(role, pin, name, noPlay) {
  const room = (pin || "").trim();
  if (room.length < 2) { ui.gateErr = "密碼至少 2 碼"; render(); return; }
  const trimmedName = (name || "").trim();
  if (role === "player" && !trimmedName) { ui.gateErr = "請輸入你的名字"; render(); return; }
  if (role === "admin" && !noPlay && !trimmedName) { ui.gateErr = "請輸入你的名字，或勾選「我不下場打球」"; render(); return; }

  ui.gateErr = "";
  identity.room = room;
  identity.isAdmin = role === "admin";
  identity.playerId = null;

  // 進房間：先把該房間現有資料抓下來
  let remote = null;
  try { remote = await apiLoad(room); } catch (e) {}
  session = remote ? Object.assign(defaultSession(), remote) : defaultSession();

  if (trimmedName && (role === "player" || (role === "admin" && !noPlay))) {
    const existing = session.players.find((p) => p.name === trimmedName);
    if (existing) {
      identity.playerId = existing.id;
    } else {
      const p = makePlayer(trimmedName);
      session.players.push(p);
      identity.playerId = p.id;
      queueSave();
    }
  }

  identity.entered = true;
  saveIdentity();
  ui.entered = true;
  ui.tab = identity.isAdmin ? (session.rounds.length ? "play" : session.squads.length ? "squad" : "setup") : (session.rounds.length ? "play" : "squad");
  render();
}
function switchIdentity() {
  identity = { isAdmin: false, playerId: null, room: null, entered: false };
  saveIdentity();
  ui.entered = false;
  ui.gateStep = "role";
  ui.gateRole = null;
  ui.gateErr = "";
  ui.tab = "setup";
}

// ---------- 資料操作 ----------
function playerName(id) { const p = session.players.find((x) => x.id === id); return p ? p.name : "?"; }
function isAdmin() { return !!identity.isAdmin; }

function addPlayerManual(name) {
  const trimmed = (name || "").trim();
  if (!trimmed) return;
  if (session.players.some((p) => p.name === trimmed)) return;
  session.players.push(makePlayer(trimmed));
  queueSave(); render();
}
function removePlayer(id) {
  session.players = session.players.filter((p) => p.id !== id);
  queueSave(); render();
}
function changeMode(m) {
  if (session.locked) return;
  session.mode = m; session.squads = []; session.bench = null;
  queueSave(); render();
}
function setCourts(n) {
  session.courts = Math.max(1, n);
  queueSave(); render();
}
function makeGrouping() {
  const { squads, bench } = buildSquads(session.players, session.mode);
  session.squads = squads; session.bench = bench;
  ui.selectedMember = null; ui.tab = "squad";
  queueSave(); render();
}
function reshuffleGrouping() {
  if (session.locked || !isAdmin()) return;
  const { squads, bench } = buildSquads(session.players, session.mode);
  session.squads = squads; session.bench = bench; ui.selectedMember = null;
  queueSave(); render();
}
function onPlayerTap(pid) {
  if (session.locked || !isAdmin()) return;
  if (ui.selectedMember === null) { ui.selectedMember = pid; render(); return; }
  if (ui.selectedMember === pid) { ui.selectedMember = null; render(); return; }
  const idxA = session.squads.findIndex((s) => s.memberIds.includes(ui.selectedMember));
  const idxB = session.squads.findIndex((s) => s.memberIds.includes(pid));
  if (idxA !== -1 && idxB !== -1 && idxA !== idxB) {
    const posA = session.squads[idxA].memberIds.indexOf(ui.selectedMember);
    const posB = session.squads[idxB].memberIds.indexOf(pid);
    session.squads[idxA].memberIds[posA] = pid;
    session.squads[idxB].memberIds[posB] = ui.selectedMember;
    queueSave();
  }
  ui.selectedMember = null; render();
}
function renameSquad(id, name) {
  const s = session.squads.find((x) => x.id === id);
  if (s) { s.name = name; queueSave(); }
}
function nextRound() {
  const max = Math.max(1, Math.floor(session.squads.length / 2));
  const result = generateRound(session.squads, Math.min(session.courts, max), session.history);
  if (!result) return;
  session.squads.forEach((s) => {
    const active = result.matches.some((m) => m.squadAId === s.id || m.squadBId === s.id);
    s.restStreak = active ? 0 : s.restStreak + 1;
  });
  session.rounds.push({ roundNo: session.rounds.length + 1, matches: result.matches, restingIds: result.restingIds });
  ui.tab = "play";
  queueSave(); render();
}
function lockAndStart() { session.locked = true; nextRound(); }
function reshuffleCurrentRound() {
  if (!isAdmin()) return;
  const cur = session.rounds[session.rounds.length - 1];
  if (!cur || cur.matches.some((m) => m.completed)) return;
  const max = Math.max(1, Math.floor(session.squads.length / 2));
  const result = generateRound(session.squads, Math.min(session.courts, max), session.history);
  if (!result) return;
  session.squads.forEach((s) => {
    const active = result.matches.some((m) => m.squadAId === s.id || m.squadBId === s.id);
    s.restStreak = active ? 0 : s.restStreak + 1;
  });
  session.rounds[session.rounds.length - 1] = { roundNo: cur.roundNo, matches: result.matches, restingIds: result.restingIds };
  queueSave(); render();
}
function requestRegrouping() {
  if (!isAdmin()) return;
  if (!confirm("重新分組會清空目前的對戰進度與歷史紀錄，隊伍名單保留可再調整。確定嗎？")) return;
  session.locked = false; session.rounds = []; session.history = {};
  ui.tab = "squad";
  queueSave(); render();
}
function canEditMatch(m) {
  if (!m || m.completed) return false;
  if (isAdmin()) return true;
  if (!identity.playerId) return false;
  const a = session.squads.find((s) => s.id === m.squadAId);
  const b = session.squads.find((s) => s.id === m.squadBId);
  return (a && a.memberIds.includes(identity.playerId)) || (b && b.memberIds.includes(identity.playerId));
}
function confirmMatch(matchId, scoreAVal, scoreBVal) {
  const round = session.rounds[session.rounds.length - 1];
  const match = round.matches.find((m) => m.id === matchId);
  if (!canEditMatch(match)) return;
  const a = parseInt(scoreAVal, 10), b = parseInt(scoreBVal, 10);
  if (isNaN(a) || isNaN(b) || a === b) return;
  const aWin = a > b;
  const key = pairKey(match.squadAId, match.squadBId);
  session.history[key] = (session.history[key] || 0) + 1;
  session.squads.forEach((s) => {
    if (s.id !== match.squadAId && s.id !== match.squadBId) return;
    const isA = s.id === match.squadAId;
    const won = isA ? aWin : !aWin;
    const my = isA ? a : b, opp = isA ? b : a;
    s.gamesPlayed++; if (won) s.wins++; else s.losses++;
    s.pointsFor += my; s.pointsAgainst += opp; s.sessionPoints += won ? 3 : 1;
  });
  match.scoreA = String(a); match.scoreB = String(b); match.completed = true; match.aWin = aWin;
  queueSave(); render();
}
function resetAll() {
  if (!isAdmin()) return;
  if (!confirm("確定要清空所有球員、分組、對戰與積分嗎？這無法復原。")) return;
  session = defaultSession();
  ui.tab = "setup";
  queueSave(); render();
}

// ---------- Render ----------
const app = document.getElementById("app");

function renderSaveStatus() {
  const el = document.getElementById("footerStatus");
  if (el) el.textContent = saveOk ? "自動同步・把連結傳給隊友，大家打開後輸入名字加入就好" : "⚠ 儲存失敗，請檢查網路";
}

function render() {
  if (!sessionLoaded) {
    app.innerHTML = `<div class="emptyState"><span class="spin" style="font-size:40px;">🏸</span></div>`;
    return;
  }
  if (!ui.entered) { app.innerHTML = renderGate(); bindGateEvents(); return; }
  app.innerHTML = renderApp();
  bindAppEvents();
}

function renderGate() {
  const header = `
    <div style="text-align:center;margin-bottom:30px;">
      <span class="spin" style="font-size:44px;">🏸</span>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;margin-top:8px;">羽球排點</div>
      <div style="color:#8FB0A4;font-size:13px;margin-top:4px;">嗨 👋 你是？</div>
    </div>`;

  if (ui.gateStep === "role") {
    return `
    <div style="padding:40px 20px;">
      ${header}
      <button class="primaryBtn" style="margin-top:0;" data-action="pick-role" data-role="admin">👑 我是主揪</button>
      <button class="ghostBtn" data-action="pick-role" data-role="player">🏸 我是一般人</button>
    </div>`;
  }

  const isAdminForm = ui.gateStep === "admin";
  const title = isAdminForm ? "👑 設定房間密碼" : "🏸 輸入房間密碼加入";
  const pinPlaceholder = isAdminForm ? "設定一組密碼（就是房間代碼）" : "輸入主揪給你的密碼";
  const submitLabel = isAdminForm ? "建立 / 登入房間" : "加入房間";

  return `
  <div style="padding:40px 20px;">
    ${header}
    <div class="card">
      <div style="font-weight:700;font-size:15px;margin-bottom:12px;">${title}</div>
      <input class="text" id="gatePinInput" style="margin-bottom:10px;" placeholder="${pinPlaceholder}" />
      ${isAdminForm ? `
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#8FB0A4;margin-bottom:10px;cursor:pointer;">
          <input type="checkbox" id="gateNoPlay" style="width:16px;height:16px;" />
          我不下場打球，只負責控場
        </label>
      ` : ""}
      <input class="text" id="gateNameInput" placeholder="輸入你的名字" />
      ${ui.gateErr ? `<div style="color:#E85C4A;font-size:12px;margin-top:8px;">${esc(ui.gateErr)}</div>` : ""}
      <button class="primaryBtn" data-action="gate-submit" data-role="${isAdminForm ? "admin" : "player"}">${submitLabel}</button>
      <button class="ghostBtn" data-action="gate-back">← 返回</button>
    </div>
    ${isAdminForm ? `<div class="hint" style="text-align:center;margin-top:10px;">這組密碼就是你的房間代碼，把它跟連結一起給隊友，他們輸入一樣的密碼才會進到同一個房間</div>` : ""}
  </div>`;
}

function bindGateEvents() {
  app.querySelectorAll("[data-action]").forEach((el) => {
    el.addEventListener("click", () => {
      const action = el.getAttribute("data-action");
      if (action === "pick-role") {
        ui.gateStep = el.getAttribute("data-role");
        ui.gateErr = "";
        render();
      } else if (action === "gate-back") {
        ui.gateStep = "role"; ui.gateErr = ""; render();
      } else if (action === "gate-submit") {
        const role = el.getAttribute("data-role");
        const pin = document.getElementById("gatePinInput").value;
        const name = document.getElementById("gateNameInput") ? document.getElementById("gateNameInput").value : "";
        const noPlay = document.getElementById("gateNoPlay") ? document.getElementById("gateNoPlay").checked : false;
        submitGateForm(role, pin, name, noPlay);
      }
    });
  });
  const noPlayBox = document.getElementById("gateNoPlay");
  const nameInput = document.getElementById("gateNameInput");
  if (noPlayBox && nameInput) {
    const syncNameVisibility = () => { nameInput.parentElement.querySelector; nameInput.style.display = noPlayBox.checked ? "none" : "block"; };
    noPlayBox.addEventListener("change", syncNameVisibility);
  }
  ["gatePinInput", "gateNameInput"].forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const btn = app.querySelector('[data-action="gate-submit"]');
        if (btn) btn.click();
      }
    });
  });
}

function renderApp() {
  const admin = isAdmin();
  const tabs = admin
    ? [["setup", "設定"], ["squad", "分組"], ["play", "對戰"], ["board", "積分榜"], ["history", "紀錄"]]
    : [["squad", "分組"], ["play", "對戰"], ["board", "積分榜"], ["history", "紀錄"]];
  const roleLabel = admin
    ? (identity.playerId ? `👑 主揪控制中 · 也在打球：${esc(playerName(identity.playerId))}` : "👑 主揪控制中")
    : `🏸 你是：${esc(playerName(identity.playerId))}`;

  const tabBtns = tabs.map(([key, label]) => `<button class="tabBtn ${ui.tab === key ? "tabBtnActive" : ""}" data-action="set-tab" data-tab="${key}">${label}</button>`).join("");

  let contentHtml = "";
  if (ui.tab === "setup" && admin) contentHtml = renderSetupTab();
  else if (ui.tab === "squad") contentHtml = renderSquadTab();
  else if (ui.tab === "play") contentHtml = renderPlayTab();
  else if (ui.tab === "board") contentHtml = renderBoardTab();
  else if (ui.tab === "history") contentHtml = renderHistoryTab();

  return `
    <div class="header">
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="spin" style="font-size:26px;">🏸</span>
        <div>
          <div class="brand">羽球排點</div>
          <div class="brandSub">SHUTTLE ROTATION CLUB</div>
        </div>
      </div>
      ${session.rounds.length > 0 ? `<div class="roundBadge"><div style="font-size:10px;color:#8FB0A4;letter-spacing:1px;">ROUND</div><div style="font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;">${session.rounds.length}</div></div>` : ""}
    </div>
    <div class="roleBar">
      <span class="${admin ? "roleTagAdmin" : "roleTagPlayer"}">${roleLabel}${admin ? ` · 房間密碼：${esc(identity.room)}` : ""}</span>
      <button class="switchBtn" data-action="switch-identity">切換身份</button>
    </div>
    <div class="tabBar">${tabBtns}</div>
    <div class="content">${contentHtml}</div>
    <div class="footer" id="footerStatus">${saveOk ? "自動同步・把連結傳給隊友，大家打開後輸入名字加入就好" : "⚠ 儲存失敗，請檢查網路"}</div>
  `;
}

function renderSetupTab() {
  const perMatch = session.mode === "doubles" ? 4 : 2;
  const maxCourts = Math.max(1, Math.floor(session.players.length / perMatch)) || 1;
  const enough = session.players.length >= perMatch;
  const chips = session.players.map((p) => `<div class="chip"><span>${esc(p.name)}</span><button class="chipX" data-action="remove-player" data-id="${p.id}">✕</button></div>`).join("");
  return `
    <div class="sectionTitle">球員名單 · ${session.players.length} 人</div>
    <div class="card">
      <div class="row">
        <input class="text" id="manualNameInput" placeholder="幫忙手動加人（例如沒帶手機的朋友）" />
        <button class="goldBtn" data-action="add-player-manual">加入</button>
      </div>
      ${session.players.length === 0 ? `<div class="emptyHint">還沒有球員 — 分享連結讓大家自己輸入名字加入，或在這裡手動加</div>` : `<div class="chipWrap">${chips}</div>`}
      ${session.locked ? `<div class="hint" style="color:#E8A99E;margin-top:10px;">隊伍已鎖定，異動名單請到「分組」頁重新分組</div>` : ""}
    </div>

    <div class="sectionTitle">賽制</div>
    <div class="card">
      <div class="row" style="margin-bottom:14px;">
        <button class="toggleBtn ${session.mode === "doubles" ? "toggleBtnActive" : ""}" data-action="set-mode" data-mode="doubles" ${session.locked ? "disabled" : ""}>雙打・固定隊友</button>
        <button class="toggleBtn ${session.mode === "singles" ? "toggleBtnActive" : ""}" data-action="set-mode" data-mode="singles" ${session.locked ? "disabled" : ""}>單打</button>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <span class="label">場地數量</span>
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="stepBtn" data-action="courts-minus">−</button>
          <span style="font-family:'Bebas Neue',sans-serif;font-size:24px;width:28px;text-align:center;display:inline-block;">${Math.min(session.courts, maxCourts) || 1}</span>
          <button class="stepBtn" data-action="courts-plus" data-max="${maxCourts}">+</button>
        </div>
      </div>
      <div class="hint">目前人數最多可開 ${maxCourts} 場（${session.mode === "doubles" ? "雙打每隊固定 2 人" : "單打每場 2 人"}）</div>
    </div>

    ${!session.locked ? `<button class="primaryBtn" data-action="make-grouping" ${enough ? "" : "disabled"}>${session.squads.length ? "重新產生分組 →" : "進行分組 →"}</button>` : ""}
    ${!enough ? `<div class="hint" style="text-align:center;margin-top:8px;">至少需要 ${perMatch} 位球員才能分組</div>` : ""}
    ${(session.squads.length > 0 || session.locked) ? `<button class="dangerGhostBtn" data-action="reset-all">清空全部重新開始</button>` : ""}
  `;
}

function renderSquadTab() {
  const admin = isAdmin();
  if (session.squads.length === 0) {
    return `
      <div class="emptyState">
        <div style="font-size:40px;margin-bottom:10px;">🤝</div>
        <div style="font-weight:600;margin-bottom:6px;">還沒有分組</div>
        <div style="color:#8FB0A4;font-size:14px;margin-bottom:16px;">${admin ? "先在「設定」加好球員，再來這裡產生分組結果" : "等主揪把大家加進來、產生分組結果"}</div>
        ${admin && session.players.length >= (session.mode === "doubles" ? 4 : 2) ? `<button class="primaryBtn" data-action="make-grouping" style="margin-top:0;">產生分組建議 🏸</button>` : ""}
      </div>`;
  }
  const squadCards = session.squads.map((s, i) => {
    const members = s.memberIds.map((pid) => `<div class="squadMember ${ui.selectedMember === pid ? "squadMemberSelected" : ""}" ${admin && !session.locked && session.mode === "doubles" ? `data-action="tap-player" data-id="${pid}" style="cursor:pointer;"` : ""}>${esc(playerName(pid))}</div>`).join("");
    const nameEl = admin ? `<input class="squadNameInput" data-action="rename-squad" data-id="${s.id}" value="${esc(s.name)}" placeholder="隊伍${i + 1}" />` : `<div class="squadNameStatic">${esc(s.name)}</div>`;
    return `<div class="squadCard">${nameEl}<div style="margin-top:8px;">${members}</div></div>`;
  }).join("");

  return `
    <div class="sectionTitle">分組結果 ${session.locked ? "· 已鎖定" : "· 草稿（可調整）"}</div>
    ${admin && !session.locked && session.mode === "doubles" ? `<div class="tipBox">💡 點一位球員、再點另一位，就能互換隊友</div>` : ""}
    <div class="squadGrid">${squadCards}</div>
    ${session.bench ? `<div class="restBox"><div style="font-size:12px;color:#E85C4A;font-weight:700;margin-bottom:4px;">👋 候補（人數為奇數，暫時排不進隊伍）</div><span class="restChip">${esc(playerName(session.bench.id))}</span></div>` : ""}
    ${admin ? (!session.locked ? `
        <button class="ghostBtn" data-action="reshuffle-grouping">🔀 重新洗牌分組</button>
        <button class="primaryBtn" data-action="lock-start">鎖定分組，開始對戰 →</button>
      ` : `<button class="dangerGhostBtn" data-action="regroup">重新分組（會清空目前對戰進度）</button>`) : ""}
  `;
}

function renderPlayTab() {
  const admin = isAdmin();
  const currentRound = session.rounds[session.rounds.length - 1];
  if (!currentRound) {
    return `
      <div class="emptyState">
        <div style="font-size:40px;margin-bottom:10px;">🏸</div>
        <div style="font-weight:600;margin-bottom:6px;">還沒有對戰</div>
        <div style="color:#8FB0A4;font-size:14px;">${admin ? "先到「分組」頁鎖定隊伍，就會自動開出第一輪" : "等主揪分組、開賽，稍等一下 🙌"}</div>
      </div>`;
  }
  const bySquadId = (id) => session.squads.find((s) => s.id === id);
  const anyStarted = currentRound.matches.some((m) => m.completed);
  const allConfirmed = currentRound.matches.every((m) => m.completed);

  const courtCards = currentRound.matches.map((m) => {
    const a = bySquadId(m.squadAId), b = bySquadId(m.squadBId);
    const editable = canEditMatch(m);
    const statusHtml = m.completed ? `<span class="doneTag">已完成</span>` : (editable ? `<span style="color:#F2B705;">輪到你輸入比分</span>` : `<span>由對戰雙方輸入</span>`);
    const sideA = a ? `<div style="flex:1;text-align:left;"><div class="squadTitle ${m.completed && m.aWin ? "playerWon" : ""}">${m.completed && m.aWin ? "👑 " : ""}${esc(a.name)}</div>${a.memberIds.map((pid) => `<div class="squadSub">${esc(playerName(pid))}</div>`).join("")}</div>` : `<div style="flex:1;"></div>`;
    const sideB = b ? `<div style="flex:1;text-align:right;"><div class="squadTitle ${m.completed && !m.aWin ? "playerWon" : ""}">${m.completed && !m.aWin ? "👑 " : ""}${esc(b.name)}</div>${b.memberIds.map((pid) => `<div class="squadSub">${esc(playerName(pid))}</div>`).join("")}</div>` : `<div style="flex:1;"></div>`;
    return `
      <div class="court ${editable && !m.completed ? "courtEditable" : ""}">
        <div class="courtLabel"><span>第 ${m.court} 場</span>${statusHtml}</div>
        <div class="courtBody">${sideA}<div class="netLine"><div class="netDash"></div><span class="vs">VS</span><div class="netDash"></div></div>${sideB}</div>
        <div class="scoreRow">
          <input class="scoreInput" id="scoreA-${m.id}" value="${esc(m.scoreA)}" placeholder="0" ${!editable || m.completed ? "disabled" : ""} inputmode="numeric" />
          <span class="scoreDash">–</span>
          <input class="scoreInput" id="scoreB-${m.id}" value="${esc(m.scoreB)}" placeholder="0" ${!editable || m.completed ? "disabled" : ""} inputmode="numeric" />
          ${editable && !m.completed ? `<button class="confirmBtn" data-action="confirm-match" data-id="${m.id}">確認</button>` : ""}
        </div>
      </div>`;
  }).join("");

  const restingHtml = currentRound.restingIds.length > 0 ? `
    <div class="restBox">
      <div style="font-size:12px;color:#E85C4A;font-weight:700;margin-bottom:6px;">😌 本輪先休息（下輪優先上場）</div>
      <div>${currentRound.restingIds.map((id) => { const s = bySquadId(id); return `<span class="restChip">${esc(s ? s.name : "?")}</span>`; }).join("")}</div>
    </div>` : "";

  let footerHtml = "";
  if (admin) {
    footerHtml = `
      ${!anyStarted ? `<button class="ghostBtn" data-action="reshuffle-round">🔀 重新洗牌本輪對戰</button>` : ""}
      <button class="primaryBtn" data-action="next-round" ${allConfirmed ? "" : "disabled"}>${allConfirmed ? "產生下一輪 →" : `還有 ${currentRound.matches.filter((m) => !m.completed).length} 場未輸入比分`}</button>`;
  } else {
    footerHtml = allConfirmed
      ? `<div class="hint" style="text-align:center;margin-top:14px;">本輪都完成了，等主揪開下一輪 🙌</div>`
      : `<div class="hint" style="text-align:center;margin-top:14px;">比賽完記得輸入比分喔</div>`;
  }

  return `<div class="sectionTitle">第 ${currentRound.roundNo} 輪 · 上場對戰</div>${courtCards}${restingHtml}${footerHtml}`;
}

function renderBoardTab() {
  const leaderboard = [...session.squads].sort((a, b) => {
    if (b.sessionPoints !== a.sessionPoints) return b.sessionPoints - a.sessionPoints;
    const wrA = a.gamesPlayed ? a.wins / a.gamesPlayed : 0, wrB = b.gamesPlayed ? b.wins / b.gamesPlayed : 0;
    if (wrB !== wrA) return wrB - wrA;
    return (b.pointsFor - b.pointsAgainst) - (a.pointsFor - a.pointsAgainst);
  });
  if (leaderboard.length === 0) return `<div class="emptyState"><div style="font-size:40px;margin-bottom:10px;">🏆</div><div style="color:#8FB0A4;font-size:14px;">還沒有分組資料</div></div>`;
  const medals = ["🥇", "🥈", "🥉"];
  const rows = leaderboard.map((s, i) => {
    const wr = s.gamesPlayed ? Math.round((s.wins / s.gamesPlayed) * 100) : 0;
    const diff = s.pointsFor - s.pointsAgainst;
    return `
      <div class="rankRow ${i === 0 ? "rankRowFirst" : ""}">
        <div class="rankNum">${medals[i] || i + 1}</div>
        <div style="flex:1;">
          <div class="rankName">${esc(s.name)}</div>
          ${session.mode === "doubles" ? `<div style="font-size:11px;color:#8FB0A4;">${s.memberIds.map((id) => esc(playerName(id))).join(" & ")}</div>` : ""}
          <div class="rankMeta">${s.wins}勝 ${s.losses}負 · 勝率 ${wr}% · 淨勝分 ${diff >= 0 ? "+" : ""}${diff}</div>
        </div>
        <div class="rankPts"><div class="rankPtsNum">${s.sessionPoints}</div><div style="font-size:10px;color:#8FB0A4;">PTS</div></div>
      </div>`;
  }).join("");
  return `<div class="sectionTitle">${session.mode === "doubles" ? "隊伍積分榜" : "個人積分榜"}</div>${rows}<div class="hint" style="margin-top:10px;">贏一場 +3 分・輸一場 +1 分（有上場就有分！）</div>`;
}

function renderHistoryTab() {
  if (session.rounds.length === 0) return `<div class="emptyState"><div style="font-size:40px;margin-bottom:10px;">📋</div><div style="color:#8FB0A4;font-size:14px;">還沒有任何紀錄</div></div>`;
  const bySquadId = (id) => session.squads.find((s) => s.id === id);
  const blocks = [...session.rounds].reverse().map((r) => {
    const rows = r.matches.map((m) => {
      const a = bySquadId(m.squadAId), b = bySquadId(m.squadBId);
      return `
        <div class="historyRow">
          <div class="historyCourt">第${m.court}場</div>
          <div style="flex:1;">
            <span class="${m.completed && m.aWin ? "historyWin" : ""}">${esc(a ? a.name : "?")}</span>
            <span style="color:#8FB0A4;"> vs </span>
            <span class="${m.completed && !m.aWin ? "historyWin" : ""}">${esc(b ? b.name : "?")}</span>
          </div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:13px;">${m.completed ? `${esc(m.scoreA)} - ${esc(m.scoreB)}` : "未完成"}</div>
        </div>`;
    }).join("");
    const restingLine = r.restingIds.length > 0 ? `<div style="font-size:12px;color:#8FB0A4;margin-top:4px;">休息：${r.restingIds.map((id) => esc(bySquadId(id) ? bySquadId(id).name : "?")).join("、")}</div>` : "";
    return `<div style="margin-bottom:18px;"><div class="sectionTitle">第 ${r.roundNo} 輪</div>${rows}${restingLine}</div>`;
  }).join("");
  return blocks;
}

function bindAppEvents() {
  app.querySelectorAll("[data-action]").forEach((el) => {
    const action = el.getAttribute("data-action");
    if (action === "rename-squad") {
      el.addEventListener("change", () => renameSquad(el.getAttribute("data-id"), el.value));
      return;
    }
    el.addEventListener("click", (e) => {
      switch (action) {
        case "set-tab": ui.tab = el.getAttribute("data-tab"); render(); break;
        case "switch-identity": switchIdentity(); render(); break;
        case "add-player-manual": addPlayerManual(document.getElementById("manualNameInput").value); break;
        case "remove-player": removePlayer(el.getAttribute("data-id")); break;
        case "set-mode": changeMode(el.getAttribute("data-mode")); break;
        case "courts-minus": setCourts(session.courts - 1); break;
        case "courts-plus": setCourts(Math.min(parseInt(el.getAttribute("data-max"), 10), session.courts + 1)); break;
        case "make-grouping": makeGrouping(); break;
        case "reshuffle-grouping": reshuffleGrouping(); break;
        case "tap-player": onPlayerTap(el.getAttribute("data-id")); break;
        case "lock-start": lockAndStart(); break;
        case "regroup": requestRegrouping(); break;
        case "reshuffle-round": reshuffleCurrentRound(); break;
        case "next-round": nextRound(); break;
        case "confirm-match": {
          const id = el.getAttribute("data-id");
          const a = document.getElementById("scoreA-" + id).value;
          const b = document.getElementById("scoreB-" + id).value;
          confirmMatch(id, a, b);
          break;
        }
        case "reset-all": resetAll(); break;
      }
    });
  });
  const manualInput = document.getElementById("manualNameInput");
  if (manualInput) manualInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addPlayerManual(manualInput.value); });
  document.querySelectorAll(".scoreInput").forEach((inp) => {
    inp.addEventListener("input", () => { inp.value = inp.value.replace(/[^0-9]/g, "").slice(0, 3); });
  });
}

// ---------- 啟動 ----------
(async function init() {
  render();
  if (identity.entered && identity.room) {
    try {
      const remote = await apiLoad(identity.room);
      if (remote) session = Object.assign(defaultSession(), remote);
    } catch (e) {}
    ui.entered = true;
    ui.tab = identity.isAdmin ? (session.rounds.length ? "play" : session.squads.length ? "squad" : "setup") : (session.rounds.length ? "play" : "squad");
  }
  sessionLoaded = true;
  render();
  setTimeout(pollLoop, 3000);
})();
</script>

</html>
